<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Multiplayer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div class="top-bar">
        <button id="topMenuBtn" class="icon-btn" onclick="openTopMenu()"><i class="fa-solid fa-bars"></i></button>
        <button id="topExitBtn" class="icon-btn exit-btn" onclick="exitGameToHome()" style="display: none;"><i class="fa-solid fa-house"></i> Exit</button>
        <div class="app-title">LUDO CLASSIC</div>
        <button class="icon-btn" onclick="openHelpModal()"><i class="fa-solid fa-circle-question"></i></button>
    </div>

    <div id="menuView" class="view-container">
        <div class="logo-box animate-item">
            <i class="fa-solid fa-chess-king logo-icon"></i>
            <h1>LUDO CLASSIC</h1>
        </div>
        <div class="menu-buttons animate-item">
            <button class="menu-btn online-btn" onclick="openOnlineSetup()">
                <i class="fa-solid fa-globe"></i>
                <span>PLAY ONLINE</span>
            </button>
            <button class="menu-btn friend-btn" onclick="openFriendSetup()">
                <i class="fa-solid fa-users"></i>
                <span>PLAY WITH FRIENDS</span>
            </button>
            <button class="menu-btn computer-btn" onclick="openComputerSetup()">
                <i class="fa-solid fa-robot"></i>
                <span>VS COMPUTER</span>
            </button>
            <button class="menu-btn pass-btn" onclick="openPassSetup()">
                <i class="fa-solid fa-people-arrows"></i>
                <span>PASS N PLAY</span>
            </button>
        </div>
    </div>

    <div id="lobbyView" class="view-container" style="display: none;">
        <div class="lobby-card animate-item">
            <h2>ROOM LOBBY</h2>
            <div class="room-code-box">
                <span>ROOM CODE:</span>
                <strong id="lobbyCodeDisplay">------</strong>
            </div>
            <div id="joinedPlayersList" class="players-list"></div>
            <p id="waitingMsg" class="waiting-text">Waiting for players to join...</p>
            <button id="startGameBtn" class="action-btn start-btn" onclick="startRoomGame()" style="display: none;">START GAME</button>
            <button class="action-btn back-btn" onclick="closeLobbyAndReturn()">LEAVE ROOM</button>
        </div>
    </div>

    <div id="gameView" class="view-container" style="display: none;">
        <div class="game-header animate-item">
            <div id="turnDisplay" class="turn-text">Turn: -</div>
            <div class="timer-box"><i class="fa-solid fa-clock"></i> <span id="timerSec">30</span>s</div>
        </div>

        <div id="board" class="ludo-board animate-item">
            <div id="home-center" class="home-center">
                <div id="home-tri-red" class="home-tri tri-red"></div>
                <div id="home-tri-green" class="home-tri tri-green"></div>
                <div id="home-tri-yellow" class="home-tri tri-yellow"></div>
                <div id="home-tri-blue" class="home-tri tri-blue"></div>
            </div>

            <div class="base red-base">
                <div id="name-tag-red" class="base-name-tag top-tag">Red</div>
                <div class="base-inner">
                    <div class="spot" id="red-base-0"></div>
                    <div class="spot" id="red-base-1"></div>
                    <div class="spot" id="red-base-2"></div>
                    <div class="spot" id="red-base-3"></div>
                </div>
                <div class="left-overlay" id="overlay-red"><span id="left-text-red">LEFT</span></div>
            </div>

            <div class="base green-base">
                <div id="name-tag-green" class="base-name-tag top-tag">Green</div>
                <div class="base-inner">
                    <div class="spot" id="green-base-0"></div>
                    <div class="spot" id="green-base-1"></div>
                    <div class="spot" id="green-base-2"></div>
                    <div class="spot" id="green-base-3"></div>
                </div>
                <div class="left-overlay" id="overlay-green"><span id="left-text-green">LEFT</span></div>
            </div>

            <div class="base yellow-base">
                <div id="name-tag-yellow" class="base-name-tag bottom-tag">Yellow</div>
                <div class="base-inner">
                    <div class="spot" id="yellow-base-0"></div>
                    <div class="spot" id="yellow-base-1"></div>
                    <div class="spot" id="yellow-base-2"></div>
                    <div class="spot" id="yellow-base-3"></div>
                </div>
                <div class="left-overlay" id="overlay-yellow"><span id="left-text-yellow">LEFT</span></div>
            </div>

            <div class="base blue-base">
                <div id="name-tag-blue" class="base-name-tag bottom-tag">Blue</div>
                <div class="base-inner">
                    <div class="spot" id="blue-base-0"></div>
                    <div class="spot" id="blue-base-1"></div>
                    <div class="spot" id="blue-base-2"></div>
                    <div class="spot" id="blue-base-3"></div>
                </div>
                <div class="left-overlay" id="overlay-blue"><span id="left-text-blue">LEFT</span></div>
            </div>
        </div>

        <div class="controls-bar animate-item">
            <button id="diceBtn" class="dice-btn" onclick="onDiceClick()">🎲</button>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div id="modalBox" class="modal-card"></div>
    </div>

    <div id="toastBanner" class="toast-banner">
        <span id="toastText">Notification text</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
